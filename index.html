<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDH Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: mesa de amigos, competitivo y divertido; números claros, cero relleno
   IDEA: un playmat de Commander: tapete oscuro, pips de maná, ranking como escalera de ligas
   PICTURE: tablero de liga (ranking con intervalo de confianza) + sesiones como barras de vida
   COLOUR and TYPE: tapete verde-petróleo profundo, hueso, acento cobre; pips WUBRG; Cinzel títulos + Inter
   LAYOUT: barra superior con pestañas, botón grande "+ Partida", contenido en una columna ancha de 1240px */
:root{color-scheme:light dark;
--bg:light-dark(#eef1ec,#0f1a19);--panel:light-dark(#ffffff,#162523);--panel2:light-dark(#e3e9e3,#1d302d);
--ink:light-dark(#152220,#e9efe9);--mut:light-dark(#566461,#9db0ab);--line:light-dark(#cfd8d2,#2a403c);
--acc:light-dark(#a8501f,#e48a52);--acc-ink:light-dark(#fff,#1a0f08);--good:light-dark(#1f7a4a,#5fcf8f);
--mW:#efe6c1;--mU:#2a7fd0;--mB:#8a7a9c;--mR:#d4402f;--mG:#2f9a5a;--mC:#a9a9a9}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px)}h2{font-size:clamp(22px,3vw,30px);margin-bottom:6px}h3{font-size:18px}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1240px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px max(4vw,14px) 0;flex-wrap:wrap}
.top h1{flex:1}
.tabs{max-width:1240px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(4vw,14px) 0}
.tabs a{flex:none;padding:10px 14px;border-radius:10px 10px 0 0;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px}
.tabs a.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:1240px;margin:auto;padding:24px max(4vw,14px) 150px}
.btn{font:600 16px Inter,sans-serif;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.fab{position:fixed;right:max(4vw,16px);bottom:60px;z-index:6;min-height:56px;font-size:18px;padding:0 24px;border-radius:28px;box-shadow:0 8px 24px #0006}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.big{font:700 clamp(30px,4vw,42px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.lbl{color:var(--mut);font-size:14px}
.fact b{display:block;font-size:17px;margin-top:2px}
section{margin-top:28px}
.sub{color:var(--mut);margin:0 0 14px;max-width:70ch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:14px;height:14px;border-radius:50%;border:1px solid #0005;display:inline-block}
.div{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.div.Challenger{background:#e48a5233;color:var(--acc)}.div.Diamond{background:#2a7fd033;color:light-dark(#1d5f9e,#7db7ee)}
.div.Platinum{background:#2f9a5a2e;color:var(--good)}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select{font:16px Inter,sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.scroll{overflow-x:auto}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:8px;display:none;max-width:260px}
.game{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seat{display:inline-block;margin:2px 10px 2px 0;font-size:14px}.seat.w{font-weight:700;color:var(--acc)}
.date-h{margin:22px 0 4px;font-weight:700;color:var(--mut)}
dialog{border:0;border-radius:20px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,96vw);max-height:92vh}
dialog::backdrop{background:#000a}
.dlg{padding:20px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.seatrow{display:grid;grid-template-columns:80px 1fr 52px;gap:8px;align-items:center}
.crown{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px;filter:grayscale(1);opacity:.5}
.crown.on{filter:none;opacity:1;background:var(--acc)}
.art{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--panel2)}
.note{font-size:13px;color:var(--mut)}
.reto{font-size:20px;font-weight:600;margin:6px 0 0}
.own{font-size:12px;color:var(--mut);font-weight:500}
.mana{display:flex;gap:6px;flex-wrap:wrap}.mana button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;opacity:.35;font:700 14px Inter,sans-serif;color:#1118}
.mana button.on{opacity:1;border-color:var(--ink)}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(4vw,14px);background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.ver{font:600 13px Inter,sans-serif;color:var(--mut);background:none;border:0;cursor:pointer;min-height:40px;padding:0 4px;text-decoration:underline dotted;text-underline-offset:3px}
.ver:hover{color:var(--acc)}.ver:focus-visible{outline:3px solid var(--acc)}
.log h3{margin:18px 0 6px;font-size:17px}.log ul{margin:0;padding-left:20px}.log li{margin:3px 0}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px}label.chk input{width:22px;min-height:22px}
.status{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mut)}
@media(max-width:600px){table{font-size:13px}.hide-s{display:none}.seatrow{grid-template-columns:64px 1fr 48px}}
@media(prefers-reduced-motion:no-preference){.card,.game{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>EDH Tracker</h1><span class="note" id="savedNote"></span></div>
 <nav class="tabs" id="tabs">
  <a href="#resumen">Resumen</a><a href="#jugadores">Jugadores</a><a href="#mazos">Mazos</a><a href="#partidas">Partidas</a><a href="#colores">Colores</a><a href="#retos">Retos</a><a href="#datos">Datos</a>
 </nav>
</header>
<main id="view"></main>
<button class="btn pri fab" id="addBtn">+ Partida</button>
<div class="tip" id="tip"></div>

<footer class="bar"><span>Hecho por Toto · powered by Claude</span><button class="ver" id="verBtn" title="Ver historial de versiones">v–</button></footer>
<dialog id="cdlg"><div class="dlg"><h2>Historial de versiones</h2><div class="log" id="clog"><p class="note">Cargando…</p></div><div class="row" style="margin:0;justify-content:flex-end"><button class="btn" id="cClose">Cerrar</button></div></div></dialog>

<dialog id="dlg"><form class="dlg" id="mform">
 <h2 id="dlgTitle">Nueva partida</h2>
 <div class="row" style="margin:0"><input type="date" id="fDate" required><input type="number" id="fTurns" placeholder="Turnos (opcional)" min="1" max="40" style="width:170px">
 <button type="button" class="btn sm" id="samePod">Misma mesa que la última</button></div>
 <div><div class="lbl">¿Quiénes jugaron?</div><div class="chips" id="fPlayers"></div>
 <div class="row" style="margin:8px 0 0"><input id="newPlayer" placeholder="Jugador nuevo" style="width:180px"><button type="button" class="btn sm" id="addPlayer">Agregar</button></div></div>
 <div id="fSeats" style="display:grid;gap:8px"></div>
 <div class="note" id="fMsg"></div>
 <div class="row" style="margin:0;justify-content:flex-end"><button type="button" class="btn" id="cancel">Cancelar</button><button type="button" class="btn" id="delMatch" hidden>Borrar</button><button class="btn pri" id="saveMatch">Guardar</button></div>
</form></dialog>

<dialog id="ddlg"><form class="dlg" id="dform">
 <h2 id="ddTitle">Mazo</h2>
 <input id="dCmd" placeholder="Commander (ej: Kuja, Genome Sorcerer)" required>
 <select id="dOwnerSel"></select>
 <div><div class="lbl">Identidad de color</div><div class="mana" id="dMana"></div></div>
 <label class="chk"><input type="checkbox" id="dUB"> Universes Beyond</label>
 <input id="dList" placeholder="Link a Moxfield / Archidekt (opcional)">
 <label class="chk"><input type="checkbox" id="dRet"> Mazo desarmado (no aparece al agregar partidas)</label>
 <div class="row" style="margin:0"><button type="button" class="btn sm" id="dScry">Detectar colores y UB con Scryfall</button><span class="note" id="dScryMsg"></span></div>
 <div class="row" style="margin:0;justify-content:flex-end"><button type="button" class="btn" id="dCancel">Cancelar</button><button class="btn pri">Guardar mazo</button></div>
</form></dialog>

<script>
{
/* ================= datos ================= */
const seed=JSON.parse(document.getElementById('seed').textContent);

const sb=(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase)?window.supabase.createClient(CFG.supabaseUrl.trim().replace(/\/(rest\/v1)?\/?$/,''),CFG.supabaseKey.trim()):null;
const KEY='edh-tracker-v2';
let db={players:[],decks:[],matches:[],ideas:[]};

const note=(t,ms=2500)=>{const n=document.getElementById('savedNote');n.textContent=t;clearTimeout(note.t);if(ms)note.t=setTimeout(()=>n.textContent='',ms)};
const saveLocal=()=>{if(sb)return;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const fromRow=r=>({id:r.id,date:r.played_on,turns:r.turns,winner:r.winner,seats:r.seats,deleted:!!r.deleted_at});
const deckFromRow=r=>({id:r.id,commander:r.commander,owner:r.owner,colors:r.colors||'',ub:r.ub,list:r.list_url||'',retired:r.retired});

async function load(){
 if(sb){
  const q=t=>sb.from(t).select('*').then(({data,error})=>{if(error)throw error;return data});
  const[pl,dk,mt,id]=await Promise.all([q('players'),q('decks'),sb.from('matches').select('*').order('id').then(({data,error})=>{if(error)throw error;return data}),q('ideas')]);
  db={players:pl.map(p=>p.name),decks:dk.map(deckFromRow),matches:mt.map(fromRow),ideas:id.map(i=>({name:i.name,rule:i.rule,type:i.kind}))};
 }else{
  let l=null;try{l=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  db=l&&l.matches?l:structuredClone({players:seed.players,decks:seed.decks,matches:seed.matches,ideas:seed.ideas});
 }
}
const store={
 async saveMatch(m){
  if(sb){const row={played_on:m.date,turns:m.turns||null,winner:m.winner,seats:m.seats};
   const r=m.id?await sb.from('matches').update(row).eq('id',m.id).select().single():await sb.from('matches').insert(row).select().single();
   if(r.error)throw r.error;m=fromRow(r.data)}
  else if(!m.id)m.id=Math.max(0,...db.matches.map(x=>x.id))+1;
  const i=db.matches.findIndex(x=>x.id===m.id);i>=0?db.matches[i]=m:db.matches.push(m);saveLocal();return m},
 async setDeleted(id,flag){
  if(sb){const r=await sb.from('matches').update({deleted_at:flag?new Date().toISOString():null}).eq('id',id);if(r.error)throw r.error}
  db.matches.find(x=>x.id===id).deleted=flag;saveLocal()},
 async saveDeck(d){
  if(sb){const r=await sb.from('decks').upsert({id:d.id,commander:d.commander,owner:d.owner,colors:d.colors,ub:!!d.ub,list_url:d.list||null,retired:!!d.retired});if(r.error)throw r.error}
  const i=db.decks.findIndex(x=>x.id===d.id);i>=0?db.decks[i]=d:db.decks.push(d);saveLocal()},
 async addPlayer(n){
  if(sb){const r=await sb.from('players').insert({name:n});if(r.error)throw r.error}
  db.players.push(n);saveLocal()}
};
const safe=async f=>{try{return await f()}catch(e){console.error(e);note('Error al guardar: '+(e.message||e),6000);throw e}};

/* ================= utilidades ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>isFinite(x)?(x*100).toFixed(1)+'%':'–';
const fmtD=d=>{if(!d)return'Sin fecha';const[y,m,dd]=d.split('-');return`${+dd}/${+m}/${y}`};
const COL={W:'var(--mW)',U:'var(--mU)',B:'var(--mB)',R:'var(--mR)',G:'var(--mG)',C:'var(--mC)'};
const CNAME={W:'Blanco',U:'Azul',B:'Negro',R:'Rojo',G:'Verde'};
const pips=c=>`<span class="pips" title="${esc(c||'?')}">${(c||'?').split('').map(x=>`<i class="pip" style="background:${COL[x]||'transparent'}"></i>`).join('')}</span>`;
const division=e=>e>=1650?'Challenger':e>=1500?'Diamond':e>=1350?'Platinum':e>=1200?'Gold':e>=1120?'Silver':'Bronze';
const slug=s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const deckBy=id=>db.decks.find(d=>d.id===id);
const cmd=id=>deckBy(id)?.commander||id;
const active=()=>db.matches.filter(m=>!m.deleted).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id-b.id);
const artUrl=c=>'https://api.scryfall.com/cards/named?format=image&version=art_crop&fuzzy='+encodeURIComponent(c.split(/\s+(?:&|\/\/?)\s+/)[0]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function scry(commander){
 const parts=commander.split(/\s+(?:&|\/\/?)\s+/).filter(Boolean),ci=new Set(),found=[];let ub=false;
 for(const part of parts){
  const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(part));await sleep(110);
  if(!r.ok)continue;const c=await r.json();found.push(c.name);(c.color_identity||[]).forEach(x=>ci.add(x));
  const u=await fetch('https://api.scryfall.com/cards/search?q='+encodeURIComponent(`!"${c.name}" is:ub not:reprint`));await sleep(110);
  if(u.ok)ub=true;
 }
 if(!found.length)return null;
 return{colors:'WUBRG'.split('').filter(x=>ci.has(x)).join('')||'C',ub,found};
}

/* incomplete beta → cuantiles, igual que BETA.INV de la planilla */
const lgamma=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return-t+Math.log(2.5066282746310005*s/x)};
const betacf=(a,b,x)=>{let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;d=1/(Math.abs(d)<1e-30?1e-30:d);let h=d;for(let m=1;m<200;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;d=1/(Math.abs(d)<1e-30?1e-30:d);c=1+aa/c;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;d=1/(Math.abs(d)<1e-30?1e-30:d);c=1+aa/c;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h};
const ibeta=(x,a,b)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b};
const betaInv=(p,a,b)=>{let lo=0,hi=1;for(let i=0;i<60;i++){const m=(lo+hi)/2;ibeta(m,a,b)<p?lo=m:hi=m}return(lo+hi)/2};

function stats(){
 const M=active(),P={},D={};const dates=new Set(),turns=[],h2h={};
 M.forEach(m=>{if(m.date)dates.add(m.date);if(m.turns)turns.push(+m.turns);const n=m.seats.length;
  m.seats.forEach(s=>{
   const p=P[s.p]??={name:s.p,P:0,W:0,pod:0,colors:{W:0,U:0,B:0,R:0,G:0},streak:0,best:0,borrowed:0};
   const won=m.winner===s.p,dk=deckBy(s.deck);
   p.P++;p.pod+=n;if(won){p.W++;p.streak++;p.best=Math.max(p.best,p.streak)}else p.streak=0;
   if(dk&&dk.owner!==s.p)p.borrowed++;
   (dk?.colors||'').split('').forEach(c=>{if(c in p.colors)p.colors[c]++});
   const d=D[s.deck]??={P:0,W:0,pilots:{},last:null};d.P++;if(won)d.W++;d.pilots[s.p]=(d.pilots[s.p]||0)+1;d.last=m.date;
   m.seats.forEach(o=>{if(o.p===s.p)return;const r=h2h[s.p+'|'+o.p]??={g:0,w:0};r.g++;if(won)r.w++});
  })});
 const players=Object.values(P).map(p=>{const L=p.P-p.W,avgPod=p.pod/p.P;return{...p,L,wr:p.W/p.P,elo:(p.W+25)/(p.P+100)*5000,avgPod,exp:1/avgPod,
  lo:betaInv(.05,1+p.W,L+1),hi:betaInv(.95,1+p.W,L+1)}}).sort((a,b)=>b.elo-a.elo);
 players.forEach((p,i)=>p.rank=i+1);
 const decks=db.decks.map(dk=>{const s=D[dk.id]||{P:0,W:0,pilots:{},last:null};const elo=s.P?(s.W+5)/(s.P+20)*5000:null;return{...dk,P:s.P,W:s.W,L:s.P-s.W,wr:s.P?s.W/s.P:NaN,elo,div:elo?division(elo):'–',pilots:s.pilots,last:s.last}});
 [...decks].filter(d=>d.elo).sort((a,b)=>b.elo-a.elo).forEach((d,i)=>d.rank=i+1);
 const byDate={};M.forEach(m=>{if(m.date)byDate[m.date]=(byDate[m.date]||0)+1});
 return{M,players,decks,sessions:Object.entries(byDate).sort(),dates,turns,h2h};
}

document.addEventListener('pointermove',e=>{const t=e.target.closest?.('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=(e.clientY+12)+'px'}else tip.style.display='none'});

/* ================= vistas ================= */
const V={};
V.resumen=()=>{
 const S=stats(),M=S.M,first=S.sessions[0]?.[0],played=S.dates.size||1;
 const days=first?Math.round((Date.now()-new Date(first))/864e5):0;
 const mostPlayed=[...S.decks].sort((a,b)=>b.P-a.P)[0];
 const bestDeck=S.decks.filter(d=>d.P>=8).sort((a,b)=>b.wr-a.wr)[0];
 const bestP=S.players.filter(p=>p.P>=20).sort((a,b)=>b.wr-a.wr)[0];
 const cB={},cP={};S.decks.forEach(d=>{const c=d.colors||'?';cB[c]=(cB[c]||0)+1;cP[c]=(cP[c]||0)+d.P});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||['?',0];const cb=top(cB),cp=top(cP);
 const streak=[...S.players].sort((a,b)=>b.best-a.best)[0];
 let nem=null;Object.entries(S.h2h).forEach(([k,r])=>{if(r.g<25)return;const[a,b]=k.split('|');const rb=S.h2h[b+'|'+a];const diff=(rb.w-r.w)/r.g;if(!nem||diff>nem.diff)nem={a,b,diff,wa:r.w,wb:rb.w,g:r.g}});
 const avgT=S.turns.length?(S.turns.reduce((a,b)=>a+b,0)/S.turns.length).toFixed(1):'–';
 const last=S.sessions[S.sessions.length-1];
 return`<h2>${M.length} partidas en ${S.dates.size} juntas</h2><p class="sub">Desde el ${fmtD(first)}: juegan en promedio cada ${(days/played).toFixed(1)} días y hacen ${(M.length/played).toFixed(1)} partidas por junta. Última junta: ${fmtD(last?.[0])} con ${last?.[1]??0} partidas.</p>

 </div>
 <section><h3>Sesiones</h3><p class="sub">Partidas por junta, en orden de fecha.</p><div class="fig card" style="min-height:240px"><svg id="sess"></svg></div></section>
 <section><h3>Datos curiosos</h3><div class="grid">
  ${mostPlayed?`<div class="card fact"><span class="lbl">Mazo más jugado</span><b>${esc(mostPlayed.commander)}</b><span class="note">${mostPlayed.P} partidas · de ${esc(mostPlayed.owner)}</span></div>`:''}
  ${bestDeck?`<div class="card fact"><span class="lbl">Mejor winrate de mazo (mín. 8 partidas)</span><b>${esc(bestDeck.commander)}</b><span class="note">${pct(bestDeck.wr)} en ${bestDeck.P} · de ${esc(bestDeck.owner)}</span></div>`:''}
  ${bestP?`<div class="card fact"><span class="lbl">Mejor winrate de jugador (mín. 20)</span><b>${esc(bestP.name)}</b><span class="note">${pct(bestP.wr)} en ${bestP.P}</span></div>`:''}
  ${streak?`<div class="card fact"><span class="lbl">Racha más larga</span><b>${esc(streak.name)}: ${streak.best} victorias seguidas</b><span class="note">contando solo partidas donde jugó</span></div>`:''}

   catch(err){fail.push(d.commander)}}
  scanLog=`Listo. ${changed.length} cambios${changed.length?': '+changed.join(' · '):''}.${fail.length?` No encontrados en Scryfall: ${fail.join(', ')}.`:''}`;render()}

 document.getElementById('fPlayers').innerHTML=[...db.players].sort((a,b)=>freq(b)-freq(a)).map(p=>`<button type="button" class="chip ${sel.includes(p)?'on':''}" data-chip="${esc(p)}">${esc(p)}</button>`).join('');
 document.getElementById('fSeats').innerHTML=sel.map(p=>{const st=seats[p]||{deck:''},own=ownDecks(p);const extra=st.deck&&st.deck!=='__new'&&!own.some(d=>d.id===st.deck)?deckBy(st.deck):null;
  return`<div class="seatrow"><b>${esc(p)}</b><div style="display:grid;gap:6px"><select data-seat="${esc(p)}"><option value="">Elegir mazo…</option>${own.map(d=>`<option value="${esc(d.id)}" ${d.id===st.deck?'selected':''}>${esc(d.commander)}</option>`).join('')}${extra?`<option value="${esc(extra.id)}" selected>${esc(extra.commander)} (de ${esc(extra.owner)})</option>`:''}<option value="__new" ${st.deck==='__new'?'selected':''}>＋ Mazo nuevo…</option></select>
  ${st.deck==='__new'?`<input data-newdeck="${esc(p)}" value="${esc(st.name||'')}" placeholder="Nombre del commander">`:''}</div><button type="button" class="crown ${winner===p?'on':''}" data-win="${esc(p)}" aria-label="Ganó ${esc(p)}">♛</button></div>`}).join('')
  +(sel.length?'<p class="note" style="margin:0">Toca la corona del que ganó. Solo aparecen los mazos propios de cada jugador.</p>':'');
}
function openDlg(id=null){editId=id;const m=id!=null?db.matches.find(x=>x.id===id):null;
 sel=m?m.seats.map(s=>s.p):[];seats=m?Object.fromEntries(m.seats.map(s=>[s.p,{deck:s.deck}])):{};winner=m?.winner||null;
 document.getElementById('fDate').value=m?.date||todayISO();document.getElementById('fTurns').value=m?.turns||'';

document.getElementById('samePod').onclick=()=>{const M=active(),m=M[M.length-1];if(!m)return;sel=m.seats.map(s=>s.p);seats={};sel.forEach(p=>seats[p]={deck:lastOwnDeck(p)});winner=null;drawDlg()};
document.getElementById('addPlayer').onclick=async()=>{const n=document.getElementById('newPlayer');const v=n.value.trim();
 if(v&&!db.players.some(p=>p.toLowerCase()===v.toLowerCase())){await safe(()=>store.addPlayer(v));sel.push(v);seats[v]={deck:'__new'}}n.value='';drawDlg()};
dlg.addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(c){const p=c.dataset.chip;if(sel.includes(p)){sel=sel.filter(x=>x!==p);if(winner===p)winner=null}else{sel.push(p);seats[p]??={deck:lastOwnDeck(p)||'__new'}}drawDlg();return}
 const w=e.target.closest('[data-win]');if(w){winner=winner===w.dataset.win?null:w.dataset.win;drawDlg()}});
dlg.addEventListener('change',e=>{const p=e.target.dataset.seat;if(p){seats[p]={deck:e.target.value};drawDlg();if(e.target.value==='__new')dlg.querySelector(`[data-newdeck="${CSS.escape(p)}"]`)?.focus()}});
dlg.addEventListener('input',e=>{const p=e.target.dataset.newdeck;if(p)seats[p].name=e.target.value});
document.getElementById('delMatch').onclick=async e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿Seguro? Toca otra vez';return}
 await safe(()=>store.setDeleted(editId,true));dlg.close();note('Partida enviada a la papelera');render()};
document.getElementById('mform').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('fMsg');
 if(sel.length<2){msg.textContent='Elige al menos 2 jugadores.';return}
 for(const p of sel){const st=seats[p]||{};if(!st.deck||(st.deck==='__new'&&!(st.name||'').trim())){msg.textContent=`Falta el mazo de ${p}.`;return}}
 if(!winner){msg.textContent='Marca quién ganó con la corona.';return}
 const btn=document.getElementById('saveMatch');btn.disabled=true;msg.textContent='Guardando…';
 try{
  const newDecks=[];
  const st=[];for(const p of sel){let id=seats[p].deck;
   if(id==='__new'){const name=seats[p].name.trim();id=slug(p)+'/'+slug(name);
    if(!deckBy(id)){const d={id,commander:name,owner:p,colors:'',ub:false,list:'',retired:false};await store.saveDeck(d);newDecks.push(d)}}
   st.push({p,deck:id})}
  const m={id:editId||undefined,date:document.getElementById('fDate').value,seats:st,winner};const t=document.getElementById('fTurns').value;if(t)m.turns=+t;
  await store.saveMatch(m);dlg.close();note('Partida guardada');render();
  for(const d of newDecks){const r=await scry(d.commander).catch(()=>null);if(r){await safe(()=>store.saveDeck({...d,colors:r.colors,ub:r.ub}));note(`${d.commander}: colores ${r.colors}${r.ub?' · UB':''}`);render()}}
 }catch(err){msg.textContent='No se pudo guardar: '+(err.message||err)}finally{btn.disabled=false}
});

/* ================= editar mazo ================= */
const ddlg=document.getElementById('ddlg');let dEdit=null,dCols=new Set();
function drawMana(){document.getElementById('dMana').innerHTML=['W','U','B','R','G','C'].map(c=>`<button type="button" data-mana="${c}" class="${dCols.has(c)?'on':''}" style="background:${COL[c]}" aria-label="${CNAME[c]||'Incoloro'}">${c}</button>`).join('')}
function openDeck(id){dEdit=id?deckBy(id):null;const d=dEdit||{commander:'',owner:db.players[0],colors:'',ub:false,list:'',retired:false};
 document.getElementById('ddTitle').textContent=dEdit?'Editar mazo':'Nuevo mazo';
 document.getElementById('dCmd').value=d.commander;
 document.getElementById('dOwnerSel').innerHTML=db.players.map(p=>`<option ${p===d.owner?'selected':''}>${esc(p)}</option>`).join('');
 dCols=new Set((d.colors||'').split('').filter(Boolean));drawMana();
 document.getElementById('dUB').checked=!!d.ub;document.getElementById('dList').value=d.list||'';document.getElementById('dRet').checked=!!d.retired;
 document.getElementById('dScryMsg').textContent='';ddlg.showModal()}
document.getElementById('dMana').addEventListener('click',e=>{const b=e.target.closest('[data-mana]');if(!b)return;const c=b.dataset.mana;
 if(c==='C'){dCols=dCols.has('C')?new Set():new Set(['C'])}else{dCols.delete('C');dCols.has(c)?dCols.delete(c):dCols.add(c)}drawMana()});
document.getElementById('dCancel').onclick=()=>ddlg.close();
document.getElementById('dScry').onclick=async()=>{const m=document.getElementById('dScryMsg'),c=document.getElementById('dCmd').value.trim();if(!c)return;m.textContent='Buscando…';
 try{const r=await scry(c);if(!r){m.textContent='No lo encontré en Scryfall.';return}dCols=new Set(r.colors.split(''));drawMana();document.getElementById('dUB').checked=r.ub;m.textContent=`Encontrado: ${r.found.join(' + ')}${r.ub?' · UB':''}`}
 catch(e){m.textContent='Scryfall no responde desde aquí.'}};
document.getElementById('dform').addEventListener('submit',async e=>{e.preventDefault();
 const commander=document.getElementById('dCmd').value.trim(),owner=document.getElementById('dOwnerSel').value;if(!commander)return;
 const colors='WUBRGC'.split('').filter(c=>dCols.has(c)).join('');
 const d={id:dEdit?.id||slug(owner)+'/'+slug(commander),commander,owner,colors,ub:document.getElementById('dUB').checked,list:document.getElementById('dList').value.trim(),retired:document.getElementById('dRet').checked};
 if(!dEdit&&deckBy(d.id)){document.getElementById('dScryMsg').textContent=`${owner} ya tiene ese mazo.`;return}
 await safe(()=>store.saveDeck(d));ddlg.close();selD=d.id;note('Mazo guardado');render()});

/* ================= versión e historial ================= */
const VER=window.EDH_VERSION||'dev';
document.getElementById('verBtn').textContent='v'+VER;
const cdlg=document.getElementById('cdlg');
document.getElementById('cClose').onclick=()=>cdlg.close();
document.getElementById('verBtn').onclick=async()=>{cdlg.showModal();const box=document.getElementById('clog');
 try{const r=await fetch('CAMBIOS.md',{cache:'no-cache'});if(!r.ok)throw 0;const lines=(await r.text()).split(/\r?\n/);
  let o='',open=false;for(const l of lines){if(l.startsWith('## ')){if(open)o+='</ul>';o+=`<h3>${esc(l.slice(3))}</h3><ul>`;open=true}else if(l.startsWith('- ')&&open)o+=`<li>${esc(l.slice(2))}</li>`}
  if(open)o+='</ul>';box.innerHTML=o||'<p class="note">Todavía no hay versiones registradas.</p>'}
 catch(e){box.innerHTML=`<p class="note">Versión actual: v${esc(VER)}. El historial completo está en CAMBIOS.md del repositorio.</p>`}};

/* ================= inicio ================= */
(async()=>{
 try{await load()}catch(e){console.error(e);note('No se pudo conectar a la base de datos: '+(e.message||e),0);if(sb)return}
 render();
 if(sb)document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!dlg.open&&!ddlg.open){try{await load();render()}catch(e){}}});
})();
}
</script>
</body>
</html>
